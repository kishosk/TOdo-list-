version: '3.8'

services:

  mongodb:
    image: mongo
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend

    container_name: todo-backend

    ports:
      - "3001:3001"

    environment:
      MONGO_URI: mongodb://mongodb:27017/ToDo

    depends_on:
      - mongodb

  frontend:
    build: ./frontend

    container_name: todo-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  mongo-data: