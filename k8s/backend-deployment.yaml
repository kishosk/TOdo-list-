apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-backend

  template:
    metadata:
      labels:
        app: todo-backend

    spec:
      containers:
      - name: todo-backend

        image: todo-backend:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 3001

        env:
        - name: MONGO_URI
          value: mongodb://mongodb:27017/ToDo