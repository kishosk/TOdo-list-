name: Todo App CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            kisho57/todo-backend:latest
            kisho57/todo-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            kisho57/todo-frontend:latest
            kisho57/todo-frontend:${{ github.sha }}

  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update image tags
        run: |
          sed -i '/frontend:/,/service:/ s/tag: .*/tag: ${{ github.sha }}/' helm/values.yaml
          sed -i '/backend:/,/service:/ s/tag: .*/tag: ${{ github.sha }}/' helm/values.yaml

      - name: Helm lint
        run: helm lint ./helm

      - name: Helm template
        run: helm template todo-app ./helm

      - name: Commit updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/values.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
          else
            git commit -m "Update Helm images to ${{ github.sha }} [skip ci]"
            git push
          fi